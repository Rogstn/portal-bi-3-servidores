# =============================================================================
# SERVIDOR 1 · APLICACIONES  (producción: 16 vCPU · 48 GB · 200 GB SSD)
# Única entrada de usuarios: el proxy en el puerto 443. Nada más publica puertos.
#
#   Reserva garantizada:  proxy/WAF, servicio de autorización (backend), Keycloak
#   Límite máximo:        portal, Superset (+ Redis), Cube API y Cube refresh worker
#
# Límites del laboratorio (techo, no consumo): ~5.5 vCPU · 6.6 GB.
# Uso:  docker compose -p bi-s1 up -d   (después de crear-redes.sh y de S2)
# =============================================================================
name: bi-s1

x-limites-pequeno: &pequeno
  cpus: 0.5
  mem_limit: 512m

services:

  # --- Reserva garantizada ---------------------------------------------------
  proxy:                        # Proxy inverso + WAF; termina TLS
    image: nginx:1.27-alpine    # endurecimiento: owasp/modsecurity-crs (Nginx + reglas OWASP)
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"                 # solo redirige a 443
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    networks: [bi_publica, bi_s1]
    <<: *pequeno

  keycloak:                     # Proveedor de identidad: OIDC/SAML, MFA, federación
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.7.3}
    restart: unless-stopped
    command: ["start", "--http-enabled=true", "--proxy-headers=xforwarded", "--http-relative-path=/auth"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-meta:5432/keycloak   # vive en S2
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      KC_HOSTNAME: https://${DOMINIO:-bi.localhost}/auth
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    networks: [bi_s1, bi_meta]
    cpus: 1.0
    mem_limit: 1536m

  backend:                      # Servicio de autorización: perfiles, guest tokens, JWT RS256 para Cube, auditoría
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "src/server.js"]
    volumes:
      - ../../backend:/app:ro
    environment:
      KEYCLOAK_URL: https://${DOMINIO:-bi.localhost}/auth
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/bi/protocol/openid-connect/certs
      SUPERSET_URL: http://superset:8088
      SUPERSET_PUBLIC_URL: https://${DOMINIO:-bi.localhost}/superset
      # REGISTRO_DB_URL: postgresql://portal:...@postgres-meta:5432/portal   (registro de perfiles en S2)
    networks: [bi_s1, bi_meta]
    <<: *pequeno

  # --- Límite máximo, prioridad menor ----------------------------------------
  portal:                       # Frontend React compilado (catálogo, selector de perfil)
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../../portal/dist:/usr/share/nginx/html:ro   # npm run build antes de levantar
    networks: [bi_s1]
    cpus: 0.25
    mem_limit: 128m

  superset:                     # Servidor de visualización: dashboards embebidos por token
    image: bi-superset:${SUPERSET_VERSION:-6.1.0}    # se construye desde ../../superset
    restart: unless-stopped
    environment:
      SUPERSET_DB_URI: postgresql+psycopg2://superset:${SUPERSET_DB_PASSWORD:-}@postgres-meta:5432/superset
      REDIS_URL: redis://redis:6379/0
    networks: [bi_s1, bi_meta]               # NO llega a ClickHouse: todo pasa por Cube
    cpus: 1.0
    mem_limit: 1536m

  redis:                        # Caché de datos de Superset (no guarda datos de negocio)
    image: redis:${REDIS_VERSION:-7.4}
    restart: unless-stopped
    networks: [bi_s1]
    <<: *pequeno

  cube-api:                     # Capa semántica: SQL API (Superset) y REST (portal)
    image: cubejs/cube:${CUBE_VERSION:-v1.6.58}
    restart: unless-stopped
    environment: &cube_env
      CUBEJS_DB_TYPE: clickhouse
      CUBEJS_DB_HOST: clickhouse                       # en S2
      CUBEJS_DB_PORT: 8123
      CUBEJS_DB_NAME: mart
      CUBEJS_DB_USER: cube_ro
      CUBEJS_DB_PASS: ${CH_CUBE_PASSWORD:-}
      CUBEJS_DB_CLICKHOUSE_READONLY: "true"
      CUBEJS_CUBESTORE_HOST: cubestore                 # en S2
      CUBEJS_DEV_MODE: "false"
      CUBEJS_PG_SQL_PORT: 15432
      # Pendiente (informe R8): el backend firmará JWT RS256 de 120 s y Cube los validará con
      # CUBEJS_JWK_URL: http://backend:4000/.well-known/jwks.json
    volumes:
      - ../../cube:/cube/conf:ro
    networks: [bi_s1, bi_semantica]
    cpus: 1.0
    mem_limit: 1g

  cube-refresh-worker:          # Refresca las preagregaciones (las guarda Cube Store en S2)
    image: cubejs/cube:${CUBE_VERSION:-v1.6.58}
    restart: unless-stopped
    environment:
      <<: *cube_env
      CUBEJS_REFRESH_WORKER: "true"
    volumes:
      - ../../cube:/cube/conf:ro
    networks: [bi_s1, bi_semantica]
    cpus: 0.5
    mem_limit: 768m

  # --- Agente de observabilidad (envía a S3, no recibe nada) -----------------
  agente:
    image: grafana/alloy:${ALLOY_VERSION:-v1.5.1}
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # lee logs de los contenedores de S1
    networks: [bi_s1, bi_telemetria]
    cpus: 0.25
    mem_limit: 256m

networks:
  bi_publica:    { external: true }
  bi_s1:         { external: true }
  bi_meta:       { external: true }
  bi_semantica:  { external: true }
  bi_telemetria: { external: true }
